name: Nix

# flake 使用固定在 nix/model-catalog.json 中的模型目录修订版本进行构建。此工作流独立于正式发布维护该固定值：
# pi.dev 从 main 发布目录后，只有当当前固定值无法再为 main 填充模型数据（例如新增了提供商），或缺少线上目录中
# 某个 main 分支提供商所拥有的模型类型（例如该提供商新增了分类器模型）时，才更新固定值；随后构建 flake 并将新固定值提交到 main。
#
# 发布标签严格按标签内容及其已提交的固定值进行构建。所有系统构建成功后，将 stable 分支快进到该标签，使
# `nix run github:earendil-works/pi/stable` runs the latest release.

on:
  push:
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nix.yml'
      - 'flake.lock'
      - 'flake.nix'
      - 'nix/**'
      - 'package-lock.json'
      - 'packages/*/package.json'
      - 'packages/coding-agent/install-lock/**'
      - 'packages/ai/scripts/hydrate-model-catalog.ts'
      - 'scripts/update-model-catalog-pin.mjs'
  workflow_run:
    workflows:
      - Publish Model Catalog
    types:
      - completed
  # 捕获直接推送到 main、未经过拉取请求的打包变化。
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: nix-${{ (github.event_name == 'pull_request' || github.ref_type == 'tag') && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pin:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.pin.outputs.revision }}
      updated: ${{ steps.pin.outputs.updated }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Refresh the model catalog pin if stale
        id: pin
        run: |
          set -euo pipefail
          # 发布标签必须使用其已提交的固定值构建，不得修改该值。
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            node scripts/update-model-catalog-pin.mjs --if-stale
          fi
          revision="$(node -p 'require("./nix/model-catalog.json").revision')"
          echo "revision=${revision}" >> "${GITHUB_OUTPUT}"
          if git diff --quiet -- nix/model-catalog.json; then
            echo "updated=false" >> "${GITHUB_OUTPUT}"
          else
            echo "updated=true" >> "${GITHUB_OUTPUT}"
            if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
              echo "::warning::The model catalog pin on main is stale; this build uses ${revision}. The pin is refreshed on main after pi.dev publishes a catalog."
            fi
          fi

  build:
    needs: pin
    # 目录发布后，仅在固定值发生变化时构建。
    if: ${{ github.event_name != 'workflow_run' || needs.pin.outputs.updated == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            system: x86_64-linux
          - runner: ubuntu-24.04-arm
            system: aarch64-linux
          - runner: macos-latest
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the resolved model catalog pin
        env:
          REVISION: ${{ needs.pin.outputs.revision }}
        run: |
          printf '{\n  "revision": "%s"\n}\n' "${REVISION}" > nix/model-catalog.json

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}

      - name: Evaluate all systems
        if: ${{ matrix.system == 'x86_64-linux' }}
        run: nix flake check --all-systems --no-build

      - name: Build
        run: nix build -L .

      - name: Smoke-test
        run: |
          ./result/bin/pi --version
          ./result/bin/pi --help > /dev/null
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "$(./result/bin/pi --version)" = "${GITHUB_REF_NAME#v}"
          fi

  update-stable:
    needs: build
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 获取完整历史，以便 git 验证推送到 stable 的操作属于快进。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # 不使用 --force 时，非快进推送会失败，因此 stable 不会退回到较旧的版本。
      - name: Fast-forward stable to the release
        run: git push origin "${GITHUB_SHA}:refs/heads/stable"

  commit-pin:
    needs:
      - pin
      - build
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.pin.outputs.updated == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Commit and push the model catalog pin
        env:
          REVISION: ${{ needs.pin.outputs.revision }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          printf '{\n  "revision": "%s"\n}\n' "${REVISION}" > nix/model-catalog.json
          git add nix/model-catalog.json
          if git diff --staged --quiet; then
            echo "Model catalog pin is already ${REVISION}."
            exit 0
          fi
          git commit -m "chore: update Nix model catalog pin"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
            git pull --rebase origin main
          done
          exit 1
